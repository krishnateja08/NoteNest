name: Notes Runner
on:
  schedule:
    - cron: "0 15 * * *"    # daily at 3PM UTC
  workflow_dispatch:         # manual trigger from GitHub UI
  push:
    paths:
      - "generatehtml.py"    # re-run when generator changes
      - "notes.json"         # re-run when notes change

permissions:
  contents: write

jobs:
  run-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate HTML
        run: python generatehtml.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "chore: auto-update [$(date '+%Y-%m-%d %H:%M')]"
          git push
